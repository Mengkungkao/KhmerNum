[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "khmernum"
version = "0.1.0"
description = "Khmer Number Identifier - A pygame-based application for identifying Khmer numerals"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mengkungkao", email = "mengkungkao@gmail.com"}
]
keywords = ["khmer", "number", "identifier", "pygame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Education",
]
dependencies = [
    "pygame>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mengkungkao/KhmerNum"
Repository = "https://github.com/mengkungkao/KhmerNum.git"
Issues = "https://github.com/mengkungkao/KhmerNum/issues"

[project.scripts]
khmernum = "khmernum.app:main"
